x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  READINGS_RETENTION_DAYS: ${READINGS_RETENTION_DAYS:-90}
  DLQ_RETENTION_DAYS: ${DLQ_RETENTION_DAYS:-30}
  DRIFT_RETENTION_DAYS: ${DRIFT_RETENTION_DAYS:-90}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
  RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-10000}
  MODEL_PATH: /app/models/model.joblib

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # internal: other containers use redpanda:9092; external: host uses localhost:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  retention:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "scripts.retention", "--apply"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

  # One-shot job: trains the model if none exists yet, then exits.
  trainer:
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["--if-missing"]
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment: *app-env
    volumes:
      - ./models:/app/models:ro
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      trainer: {condition: service_completed_successfully}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      trainer: {condition: service_completed_successfully}
    restart: unless-stopped

  monitoring:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    environment:
      <<: *app-env
      BASELINE_FEATURES_PATH: /app/models/baseline_features.csv
      DRIFT_WINDOW_SIZE: ${DRIFT_WINDOW_SIZE:-1000}
      DRIFT_CHECK_INTERVAL_SECONDS: ${DRIFT_CHECK_INTERVAL_SECONDS:-30}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      trainer: {condition: service_completed_successfully}
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
      DASHBOARD_REFRESH_SECONDS: 2
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      <<: *app-env
      NUM_SENSORS: ${NUM_SENSORS:-5}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      ANOMALY_RATE: ${ANOMALY_RATE:-0}
      DRIFT_PER_READING: ${DRIFT_PER_READING:-0}
      INVALID_RATE: ${INVALID_RATE:-0}
    depends_on:
      redpanda: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
