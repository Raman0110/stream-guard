# Infrastructure for StreamGuard. Application services are added in later milestones.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # internal: other containers use redpanda:9092; external: host uses localhost:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment: &app-env
      # Inside the compose network, services reach each other by service name.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      <<: *app-env
      NUM_SENSORS: ${NUM_SENSORS:-5}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      ANOMALY_RATE: ${ANOMALY_RATE:-0}
      DRIFT_PER_READING: ${DRIFT_PER_READING:-0}
      INVALID_RATE: ${INVALID_RATE:-0}
    depends_on:
      redpanda: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
