name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest --cov=common --cov=producer --cov=consumer --cov-report=term-missing
      - name: Validate docker-compose file
        run: docker compose config --quiet
      # Docker image builds are added once each service has a Dockerfile.
