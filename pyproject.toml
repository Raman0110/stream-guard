[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["common", "producer", "consumer", "ml"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "testcontainers.*", "sklearn.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]
