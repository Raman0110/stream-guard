[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends()/Query() in argument defaults is the framework's normal idiom
flake8-bugbear.extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["common", "producer", "consumer", "ml", "api", "monitoring"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "testcontainers.*", "sklearn.*", "joblib.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]
